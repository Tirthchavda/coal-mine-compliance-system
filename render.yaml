services:
  # Unified Full-Stack Web Service (Frontend + Backend on 1 Single URL)
  - type: web
    name: coal-mine-compliance-system
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && node node_modules/vite/bin/vite.js build && cd ../backend && npm install
    startCommand: cd backend && npx tsx src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
